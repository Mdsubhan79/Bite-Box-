<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Catering Services - Choose Your Staff & Decor</title>
    <link rel="icon" type="image/x-icon" href="briobite.png">
    <style>
        :root {
            --primary: #e74c3c;
            --secondary: #c0392b;
            --accent: #f39c12;
            --dark: #1e2a2e;
            --light: #ecf0f1;
            --white: #ffffff;
            --green: #27ae60;
            --red: #e74c3c;
            --orange: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.2s ease;
        }

        /* ========== RESPONSIVE MEDIA QUERIES (250px to larger) ========== */
        /* Base styles start from 250px (minimum supported) */
        @media (min-width: 250px) {
            body {
                padding: 12px;
            }
            .page-header {
                padding: 20px 12px;
                margin-bottom: 24px;
            }
            .page-header h1 {
                font-size: 1.4rem;
            }
            .page-header p {
                font-size: 0.75rem;
            }
            .services-grid {
                gap: 16px;
                padding: 0 8px;
                grid-template-columns: 1fr;
            }
            .service-card {
                padding: 20px 16px;
            }
            .service-card .icon {
                font-size: 2.5rem;
            }
            .service-card h3 {
                font-size: 1.2rem;
            }
            .package-card {
                padding: 25px 18px;
            }
            .package-card h3 {
                font-size: 1.4rem;
            }
            .package-card .price {
                font-size: 2rem;
            }
            .cart-drawer {
                width: calc(100% - 24px);
                right: 12px;
                left: 12px;
                bottom: 90px;
                max-height: 55vh;
                padding: 18px;
            }
            .modal {
                padding: 20px;
                width: 95%;
            }
            .tent-options {
                grid-template-columns: 1fr;
            }
        }

        /* Small phones (360px and up) */
        @media (min-width: 360px) {
            body {
                padding: 14px;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .services-grid {
                gap: 18px;
            }
            .cart-drawer {
                width: calc(100% - 30px);
                right: 15px;
                left: 15px;
            }
        }

        /* Phones landscape & small tablets (480px and up) */
        @media (min-width: 480px) {
            body {
                padding: 16px;
            }
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .page-header h1 {
                font-size: 1.9rem;
            }
            .cart-drawer {
                width: 400px;
                right: 20px;
                left: auto;
                bottom: 100px;
            }
            .modal {
                width: 90%;
                max-width: 550px;
            }
        }

        /* Tablets (640px and up) */
        @media (min-width: 640px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .page-header {
                padding: 30px 20px;
            }
        }

        /* Desktop / large tablets (768px and up) */
        @media (min-width: 768px) {
            body {
                padding: 24px;
            }
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .service-card {
                padding: 35px 25px;
            }
            .cart-drawer {
                width: 420px;
                right: 30px;
                left: auto;
            }
        }

        /* Large screens (1024px and up) */
        @media (min-width: 1024px) {
            .services-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .page-header h1 {
                font-size: 2.5rem;
            }
        }

        /* Extra large (1280px and up) original 4 columns */
        @media (min-width: 1280px) {
            .services-grid {
                grid-template-columns: repeat(4, 1fr);
                max-width: 1400px;
            }
        }

        /* Very large screens (1600px) */
        @media (min-width: 1600px) {
            .services-grid {
                grid-template-columns: repeat(4, 1fr);
                max-width: 1600px;
            }
            body {
                padding: 32px;
            }
        }

        /* Page header & card styles */
        .page-header {
            text-align: center;
            background: linear-gradient(135deg, #081b19 0%, #012c27 100%);
            color: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .page-header h1 {
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-header p {
            opacity: 0.9;
        }

        .services-grid {
            display: grid;
            margin: 0 auto 40px;
        }

        .service-card {
            background: #10332F;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            border: 2px solid transparent;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(231, 76, 60, 0.2);
            border-color: var(--primary);
        }

        .service-card .icon {
            margin-bottom: 15px;
            display: block;
        }

        .service-card h3 {
            color: #ecf0f1;
            margin-bottom: 8px;
        }

        .service-card .tagline {
            color: #b1b1b1;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .service-card .badge {
            display: inline-block;
            background: var(--accent);
            color: rgb(0, 0, 0);
            padding: 6px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .package-card {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.3);
            position: relative;
            overflow: hidden;
        }

        .package-card:hover {
            transform: translateY(-10px);
        }

        .package-card .offer-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            color: #ee5a24;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .package-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .package-card .price { font-size: 2.5rem; font-weight: 700; margin: 15px 0; }
        .package-card .features { list-style: none; text-align: left; max-width: 300px; margin: 0 auto; }
        .package-card .features li { padding: 8px 0; font-size: 0.95rem; }
        .package-card .features li::before { content: '✓ '; font-weight: bold; }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #333;
            z-index: 10;
        }
        .staff-counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }
        .staff-counter button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .staff-counter button:active { transform: scale(0.95); }
        .tent-options {
            display: grid;
            gap: 15px;
            margin: 20px 0;
        }
        .tent-option {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .tent-option.selected {
            border-color: var(--primary);
            background: #fff5f5;
        }
        .cart-popup {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }
        .cart-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .cart-toggle:hover { transform: scale(1.05); }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--dark);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* Cart Drawer - click outside will close it (managed by JS) */
        .cart-drawer {
            position: fixed;
            bottom: 110px;
            right: 30px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: none;
            z-index: 1001;
            transition: 0.2s ease;
        }
        .cart-drawer.active { display: block; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #333;
            font-weight: 700;
            font-size: 1.3rem;
            text-align: right;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-block {
            display: block;
            width: 100%;
            margin-top: 15px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #666;
        }
        .custom-option {
            margin-top: 20px;
            background: #fff5f1;
            border: 2px dashed #ff7b54;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }
        .custom-title {
            font-size: 22px;
            font-weight: 800;
            color: #ff5722;
            margin-bottom: 8px;
        }
        .custom-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 18px;
        }
        .custom-option input,
        .custom-option textarea,
        .custom-option select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
            outline: none;
            margin-bottom: 14px;
            font-size: 14px;
            resize: none;
            background: white;
        }
        .custom-option textarea {
            min-height: 100px;
        }
        .custom-option input:focus,
        .custom-option textarea:focus,
        .custom-option select:focus {
            border-color: #ff5722;
        }
        .custom-tent-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .custom-tent-btn:hover { background: #e64a19; transform: scale(1.02); }
        .tent-size-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }
        .tent-size-row input { margin-bottom: 0; flex: 1; }
        .size-x { font-weight: bold; font-size: 1.2rem; }
        .selected-tent-box {
            background: #ffefef;
            padding: 15px;
            border-radius: 16px;
        }
        .remove-item {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }
        .remove-item:hover { color: #e74c3c; }
        .date-status { margin: 15px 0; text-align: center; font-weight: 600; }
        .tent-package-card{
            background:#ffffff;
            border-radius:20px;
            padding:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            border:2px solid #f0f0f0;
            text-align:center;
        }
        .tent-package-card h3{
            font-size:22px;
            margin-bottom:10px;
            color:#0e2b28;
        }
        .tent-package-card h2{
            color:#ff5722;
            margin-bottom:15px;
        }
        .tent-items{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
            margin-bottom:20px;
        }
        .tent-item{
            background:#fff3e0;
            color:#ff5722;
            padding:8px 14px;
            border-radius:30px;
            font-size:13px;
            font-weight:700;
        }
        .select-tent-btn{
            margin-top:15px;
            padding:10px 18px;
            border:none;
            border-radius:10px;
            background:#ff9800;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        .tent-option{
            cursor:pointer;
            transition:0.3s;
        }
        .tent-option:hover{
            transform:translateY(-3px);
            border:2px solid #ff9800;
        }
        .tent-image { font-size: 3rem; margin-bottom: 10px; }
        .small { font-size: 0.85rem; color: #666; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>🍽️ Catering Services</h1>
        <p>Choose from our premium staff & decoration options</p>
    </div>

    <div class="services-grid" id="servicesGrid">
        <div class="loading">Loading catering services...</div>
    </div>
     
    <!-- Staff Modal -->
    <div class="modal-overlay" id="staffModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('staffModal')">&times;</button>
            <h3 id="staffModalTitle">Select Staff</h3>
            <div class="staff-counter">
                <button onclick="changeStaffQty(-1)">−</button>
                <span class="quantity" id="staffQty" style="font-size:2rem;min-width:60px;">1</span>
                <button onclick="changeStaffQty(1)">+</button>
            </div>
            <div class="staff-price" style="text-align:center;">Price per staff: <span id="staffUnitPrice">₹500</span></div>
            <div class="total-staff-price" style="text-align:center;font-weight:700;margin:15px 0;">Total: <span id="staffTotalPrice">₹500</span></div>
            <button class="btn btn-primary btn-block" onclick="confirmStaffSelection()">Confirm & Add to Cart</button>
        </div>
    </div>

    <!-- Tent Modal -->
    <div class="modal-overlay" id="tentModal">
        <div class="modal" style="max-width:700px;">
            <button class="modal-close" onclick="closeModal('tentModal')">&times;</button>
            <h3>Select Tent & Decoration</h3>
            <div class="tent-options" id="tentOptions"></div>
            <div id="selectedTentInfo" style="display:none;margin-top:15px;padding:15px;background:#ffebee;border-radius:10px;text-align:center;"></div>
        </div>
    </div>

    <!-- Date Modal -->
    <div class="modal-overlay" id="dateModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('dateModal')">&times;</button>
            <h3>📅 Select Service Date</h3>
            <div class="date-picker-container" style="margin:20px 0;text-align:center;">
                <input type="date" id="serviceDate" min="2026-01-01" style="padding:12px;border-radius:10px;border:2px solid #ddd;width:100%;">
            </div>
            <div class="date-status" id="dateStatus" style="display:none;"></div>
            <button class="btn btn-primary btn-block" id="confirmDateBtn" onclick="confirmDate()" disabled>Confirm Date & Finish</button>
        </div>
    </div>

    <!-- Cart Popup with click anywhere to close -->
    <div class="cart-popup">
        <button class="cart-toggle" id="cartToggleBtn">🛒<span class="cart-count" id="cartCount">0</span></button>
        <div class="cart-drawer" id="cartDrawer">
            <h4>🛒 Catering Cart</h4>
            <div id="cartItems"><p style="color:#999;text-align:center;">No items yet</p></div>
            <div class="cart-total" id="cartTotal">Total: ₹0</div>
            <button class="btn btn-primary btn-block" onclick="proceedToDate()" id="proceedBtn" disabled>Proceed to Date →</button>
        </div>
    </div>

    <script>
        const API_BASE = "https://bbbackend-bng2.onrender.com";
        
        // Cart state
        let cart = {
            servingStaff: { qty: 0, pricePerUnit: 500 },
            cleaningStaff: { qty: 0, pricePerUnit: 400 },
            cookingStaff: { qty: 0, pricePerUnit: 800 },
            tent: null,
            date: null,
            isUrgent: false
        };
        
        let currentStaffType = null;
        let tempStaffQty = 1;
        let tempTentSelection = null;
        let currentStaffPrice = 500;
        
        // ========== CLICK ANYWHERE TO CLOSE CART ==========
        function initCartCloseOnOutsideClick() {
            const cartDrawer = document.getElementById('cartDrawer');
            const cartToggleBtn = document.getElementById('cartToggleBtn');
            
            document.addEventListener('click', function(event) {
                const isCartDrawer = cartDrawer && cartDrawer.contains(event.target);
                const isToggleBtn = cartToggleBtn && cartToggleBtn.contains(event.target);
                const isCartActive = cartDrawer && cartDrawer.classList.contains('active');
                
                if (isCartActive && !isCartDrawer && !isToggleBtn) {
                    cartDrawer.classList.remove('active');
                }
            });
            
            if (cartDrawer) {
                cartDrawer.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
            if (cartToggleBtn) {
                cartToggleBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleCart();
                });
            }
        }
        
        async function loadServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '<div class="loading">Loading catering services...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/catering/services`);
                const data = await response.json();
                
                let services = [];
                if (data.services && Array.isArray(data.services)) {
                    services = data.services;
                } else if (Array.isArray(data)) {
                    services = data;
                }
                
                if (services.length === 0) {
                    grid.innerHTML = '<div class="loading">No catering services available. Please check back later.</div>';
                    return;
                }
                
                let html = '';
                
                services.forEach(service => {
                    if (service.category === 'serving') {
                        html += `
                            <div class="service-card" onclick="openStaffModal('serving', ${service.price}, '${escapeHtml(service.title)}')">
                                <span class="icon">${service.icon || '👨‍🍳'}</span>
                                <h3>${escapeHtml(service.title)}</h3>
                                <p class="tagline">${escapeHtml(service.tagline || 'Professional service')}</p>
                                <span class="badge">₹${service.price}/${service.unit || 'staff'}</span>
                            </div>
                        `;
                    } else if (service.category === 'cleaning') {
                        html += `
                            <div class="service-card" onclick="openStaffModal('cleaning', ${service.price}, '${escapeHtml(service.title)}')">
                                <span class="icon">${service.icon || '🧹'}</span>
                                <h3>${escapeHtml(service.title)}</h3>
                                <p class="tagline">${escapeHtml(service.tagline || 'Keep venue spotless')}</p>
                                <span class="badge">₹${service.price}/${service.unit || 'staff'}</span>
                            </div>
                        `;
                    } else if (service.category === 'cooking') {
                        html += `
                            <div class="service-card" onclick="openStaffModal('cooking', ${service.price}, '${escapeHtml(service.title)}')">
                                <span class="icon">${service.icon || '👨‍🍳'}</span>
                                <h3>${escapeHtml(service.title)}</h3>
                                <p class="tagline">${escapeHtml(service.tagline || 'Expert chefs')}</p>
                                <span class="badge">₹${service.price}/${service.unit || 'staff'}</span>
                            </div>
                        `;
                    } else if(service.category === 'tent'){
                        html += `
                            <div class="service-card" onclick='openTentModalFromService(${JSON.stringify(service).replace(/'/g,"&#39;")})'>
                                <span class="icon">${service.icon || '🎪'}</span>
                                <h3>${escapeHtml(service.title)}</h3>
                                <p class="tagline">${escapeHtml(service.tagline || '')}</p>
                                <span class="badge">View Tent Packages</span>
                            </div>
                        `;
                    } else if (service.category === 'package') {
                        const pkgStr = JSON.stringify(escapeHtmlObj(service)).replace(/"/g, '&quot;');
                        html += `
                            <div class="package-card" onclick="selectFullPackageFromService(${pkgStr})">
                                <div class="offer-badge">🔥 BEST DEAL</div>
                                <span class="icon" style="font-size:3rem;">${service.icon || '🎉'}</span>
                                <h3>${escapeHtml(service.title)}</h3>
                                <p>${escapeHtml(service.tagline || 'Everything you need')}</p>
                                <div class="price">₹${service.price}</div>
                                <ul class="features">
                                    ${service.items ? service.items.map(item => `<li>${escapeHtml(item)}</li>`).join('') : '<li>Complete catering solution</li>'}
                                </ul>
                            </div>
                        `;
                    }
                });
                
                grid.innerHTML = html;
                
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="loading">Failed to load services. Please refresh.</div>';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function escapeHtmlObj(obj) {
            const newObj = {};
            for (let key in obj) {
                if (typeof obj[key] === 'string') newObj[key] = escapeHtml(obj[key]);
                else if (Array.isArray(obj[key])) newObj[key] = obj[key].map(i => typeof i === 'string' ? escapeHtml(i) : i);
                else newObj[key] = obj[key];
            }
            return newObj;
        }
        
        function openStaffModal(type, price, title) {
            currentStaffType = type;
            tempStaffQty = 1;
            currentStaffPrice = price;
            document.getElementById('staffQty').textContent = '1';
            document.getElementById('staffModalTitle').textContent = title;
            document.getElementById('staffUnitPrice').innerHTML = '₹' + price;
            document.getElementById('staffTotalPrice').innerHTML = '₹' + price;
            document.getElementById('staffModal').classList.add('active');
        }
        
        function changeStaffQty(delta) {
            tempStaffQty = Math.max(1, tempStaffQty + delta);
            document.getElementById('staffQty').textContent = tempStaffQty;
            document.getElementById('staffTotalPrice').innerHTML = '₹' + (currentStaffPrice * tempStaffQty);
        }
        
        function confirmStaffSelection() {
            if (currentStaffType === 'serving') {
                cart.servingStaff.qty = tempStaffQty;
                cart.servingStaff.pricePerUnit = currentStaffPrice;
            }
            if (currentStaffType === 'cleaning') {
                cart.cleaningStaff.qty = tempStaffQty;
                cart.cleaningStaff.pricePerUnit = currentStaffPrice;
            }
            if (currentStaffType === 'cooking') {
                cart.cookingStaff.qty = tempStaffQty;
                cart.cookingStaff.pricePerUnit = currentStaffPrice;
            }
            closeModal('staffModal');
            updateCart();
            alert(`${currentStaffType} staff: ${tempStaffQty} added!`);
        }
        
        function openTentModalFromService(service) {
            const tentOptionsDiv = document.getElementById('tentOptions');
            let html = '';
            
            if (service.sizes && service.sizes.length) {
                service.sizes.forEach(size => {
                    const itemsStr = (size.items && size.items.length) ? size.items.join(", ") : "Complete tent setup";
                    const sizeName = size.size || (size.name || "Standard");
                    const sizePrice = size.price || 5000;
                    html += `
                        <div class="tent-option" onclick="selectTentCard(this)" data-size="${escapeHtml(sizeName)}" data-price="${sizePrice}" data-items="${escapeHtml(itemsStr)}">
                            <div class="tent-image">🎪</div>
                            <h3>${escapeHtml(sizeName)}</h3>
                            <p><strong>₹${sizePrice}</strong></p>
                            <div class="tent-items small">${escapeHtml(itemsStr)}</div>
                            <button class="select-tent-btn">Select Tent</button>
                        </div>
                    `;
                });
            } else {
                const itemsList = service.items ? service.items.join(', ') : 'Complete decoration';
                const defaultPrice = service.price || 5000;
                html += `
                    <div class="tent-option" onclick="selectTentCard(this)" data-size="Standard" data-price="${defaultPrice}" data-items="${escapeHtml(itemsList)}">
                        <div class="tent-image">🎪</div>
                        <h3>Standard Tent</h3>
                        <p><strong>₹${defaultPrice}</strong></p>
                        <div class="tent-items small">${escapeHtml(itemsList)}</div>
                        <button class="select-tent-btn">Select Tent</button>
                    </div>
                `;
            }
            
            html += `
                <div class="tent-option custom-option" onclick="event.stopPropagation(); hideTentConfirmBox()">
                    <h3 class="custom-title">✨ Create Your Own Tent Package</h3>
                    <p class="custom-text">Select tent type, size & quantity</p>
                    <select id="customTentType">
                        <option value="">Select Tent Type</option>
                        <option value="Wedding Tent">Wedding Tent</option>
                        <option value="Party Tent">Party Tent</option>
                        <option value="Birthday Tent">Birthday Tent</option>
                        <option value="Reception Tent">Reception Tent</option>
                        <option value="Outdoor Tent">Outdoor Tent</option>
                        <option value="Custom Tent">Custom Tent</option>
                    </select>
                    <div class="tent-size-row">
                        <input type="number" id="customTentWidth" placeholder="Width (ft)" min="1">
                        <span class="size-x">X</span>
                        <input type="number" id="customTentHeight" placeholder="Height (ft)" min="1">
                    </div>
                    <input type="number" id="customTentQuantity" placeholder="Tent Quantity" min="1">
                    <textarea id="customTentItems" placeholder="Enter Equipment & Decoration Items&#10;Example:&#10;100 Chairs&#10;Stage&#10;Lighting&#10;Cooler"></textarea>
                    <button class="custom-tent-btn" onclick="saveCustomTent()">Add Custom Tent</button>
                </div>
            `;
            tentOptionsDiv.innerHTML = html;
            document.getElementById('tentModal').classList.add('active');
        }
        
        function selectTentCard(element) {
            const size = element.getAttribute('data-size');
            const price = parseFloat(element.getAttribute('data-price'));
            const items = element.getAttribute('data-items') || '';
            
            tempTentSelection = {
                size: size,
                price: price,
                items: items,
                isCustom: false
            };
            
            document.querySelectorAll("#tentOptions .tent-option").forEach(el => {
                el.classList.remove("selected");
            });
            element.classList.add("selected");
            
            const infoBox = document.getElementById("selectedTentInfo");
            infoBox.style.display = "block";
            infoBox.innerHTML = `
                <div class="selected-tent-box">
                    <strong>Selected Tent</strong><br><br>
                    <span style="font-size:1.1rem;">${escapeHtml(size)}</span><br>
                    <span style="font-size:1.3rem;color:#e74c3c;">₹${price}</span><br><br>
                    <small>${escapeHtml(items.substring(0, 100))}</small><br><br>
                    <button class="btn btn-primary" onclick="confirmTentSelection()">Confirm & Add</button>
                </div>
            `;
        }
        
        function confirmTentSelection() {
            if (!tempTentSelection) { alert('Select a tent'); return; }
            cart.tent = tempTentSelection;
            closeModal('tentModal');
            updateCart();
            alert(`Tent ${tempTentSelection.size} added!`);
        }
        
        function hideTentConfirmBox() {
            document.getElementById("selectedTentInfo").style.display = "none";
        }
        
        function saveCustomTent() {
            const tentType = document.getElementById("customTentType").value;
            const width = document.getElementById("customTentWidth").value;
            const height = document.getElementById("customTentHeight").value;
            const quantity = document.getElementById("customTentQuantity").value;
            const items = document.getElementById("customTentItems").value;
            if(!tentType || !width || !height || !quantity){
                alert("Please fill all required fields (Type, Width, Height, Quantity)");
                return;
            }
            const customTent = {
                size: width + "x" + height + " ft (" + tentType + ")",
                price: Number(width) * Number(height) * 5 * Number(quantity),
                items: items || "Custom decoration package",
                quantity: quantity,
                type: tentType,
                isCustom: true
            };
            cart.tent = customTent;
            updateCart();
            closeModal("tentModal");
            alert("Custom Tent Added Successfully");
        }
        
        function selectFullPackageFromService(service) {
            cart.servingStaff.qty = 4;
            cart.cleaningStaff.qty = 2;
            cart.cookingStaff.qty = 3;
            cart.tent = { size: 'Premium Package Tent', price: 5000, items: 'Complete tent & decor', isCustom: false };
            updateCart();
            alert(`🎉 ${service.title} added! Total: ₹${service.price}`);
        }
        
        function proceedToDate() {
            if (cart.servingStaff.qty === 0 && cart.cleaningStaff.qty === 0 && cart.cookingStaff.qty === 0 && !cart.tent) {
                alert('Please add items to cart first');
                return;
            }
            document.getElementById('dateModal').classList.add('active');
        }
        
        async function checkDateAvailability() {
            const date = document.getElementById('serviceDate').value;
            const statusDiv = document.getElementById('dateStatus');
            const confirmBtn = document.getElementById('confirmDateBtn');
            if (!date) { statusDiv.style.display = 'none'; confirmBtn.disabled = true; return; }
            try {
                const res = await fetch(`${API_BASE}/api/catering/check-date`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date })
                });
                const data = await res.json();
                statusDiv.style.display = 'block';
                if (data.available) {
                    statusDiv.innerHTML = '🟢 This date is available!';
                    statusDiv.style.background = '#d4edda';
                    statusDiv.style.padding = '12px';
                    statusDiv.style.borderRadius = '10px';
                    confirmBtn.disabled = false;
                } else {
                    statusDiv.innerHTML = '🔴 This date is NOT available';
                    statusDiv.style.background = '#f8d7da';
                    confirmBtn.disabled = true;
                }
            } catch(err) { alert('Date check failed'); }
        }
        
        async function confirmDate() {
            const date = document.getElementById('serviceDate').value;
            if (!date) { alert('Select date'); return; }
            cart.date = date;
            const total = (cart.servingStaff.qty * cart.servingStaff.pricePerUnit) +
                         (cart.cleaningStaff.qty * cart.cleaningStaff.pricePerUnit) +
                         (cart.cookingStaff.qty * cart.cookingStaff.pricePerUnit) +
                         (cart.tent ? cart.tent.price : 0);
            const bookingData = {
                customerName: "Guest User",
                phone: "0000000000",
                servingStaff: { qty: cart.servingStaff.qty, price: cart.servingStaff.pricePerUnit },
                cleaningStaff: { qty: cart.cleaningStaff.qty, price: cart.cleaningStaff.pricePerUnit },
                cookingStaff: { qty: cart.cookingStaff.qty, price: cart.cookingStaff.pricePerUnit },
                tent: cart.tent,
                date: cart.date,
                urgentBooking: cart.isUrgent,
                totalPrice: total
            };
            try {
                const res = await fetch(`${API_BASE}/api/catering/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ Catering Service Booked Successfully!');
                    closeModal('dateModal');
                    cart = { servingStaff: { qty: 0, pricePerUnit: 500 }, cleaningStaff: { qty: 0, pricePerUnit: 400 }, cookingStaff: { qty: 0, pricePerUnit: 800 }, tent: null, date: null, isUrgent: false };
                    updateCart();
                } else {
                    alert('Booking failed: ' + (data.message || 'Unknown error'));
                }
            } catch(err) { alert('Server error'); }
        }
        
        function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
        function toggleCart() { 
            const drawer = document.getElementById('cartDrawer');
            drawer.classList.toggle('active');
        }
        
        function updateCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');
            const cartCountSpan = document.getElementById('cartCount');
            const proceedBtn = document.getElementById('proceedBtn');
            let items = [], totalCount = 0, totalPrice = 0;
            if (cart.servingStaff.qty > 0) {
                const price = cart.servingStaff.qty * cart.servingStaff.pricePerUnit;
                items.push({ name: 'Serving Staff', qty: cart.servingStaff.qty, price: cart.servingStaff.pricePerUnit, total: price });
                totalCount += cart.servingStaff.qty;
                totalPrice += price;
            }
            if (cart.cleaningStaff.qty > 0) {
                const price = cart.cleaningStaff.qty * cart.cleaningStaff.pricePerUnit;
                items.push({ name: 'Cleaning Staff', qty: cart.cleaningStaff.qty, price: cart.cleaningStaff.pricePerUnit, total: price });
                totalCount += cart.cleaningStaff.qty;
                totalPrice += price;
            }
            if (cart.cookingStaff.qty > 0) {
                const price = cart.cookingStaff.qty * cart.cookingStaff.pricePerUnit;
                items.push({ name: 'Cooking Staff', qty: cart.cookingStaff.qty, price: cart.cookingStaff.pricePerUnit, total: price });
                totalCount += cart.cookingStaff.qty;
                totalPrice += price;
            }
            if (cart.tent) {
                items.push({ name: `Tent ${cart.tent.size}`, qty: 1, price: cart.tent.price, total: cart.tent.price });
                totalCount += 1;
                totalPrice += cart.tent.price;
            }
            if (items.length === 0) {
                cartItemsDiv.innerHTML = '<p style="color:#999;text-align:center;">No items yet</p>';
            } else {
                cartItemsDiv.innerHTML = items.map((item, idx) => `
                    <div class="cart-item">
                        <div><strong>${escapeHtml(item.name)}</strong>${item.qty > 1 ? ` × ${item.qty}` : ''}<br><small>₹${item.price} each</small></div>
                        <div><span>₹${item.total}</span><button class="remove-item" onclick="removeCartItem(${idx})">×</button></div>
                    </div>
                `).join('');
            }
            cartTotalDiv.textContent = `Total: ₹${totalPrice.toLocaleString()}`;
            cartCountSpan.textContent = totalCount;
            proceedBtn.disabled = totalCount === 0;
        }
        
        function removeCartItem(index) {
            const keys = [];
            if (cart.servingStaff.qty > 0) keys.push('servingStaff');
            if (cart.cleaningStaff.qty > 0) keys.push('cleaningStaff');
            if (cart.cookingStaff.qty > 0) keys.push('cookingStaff');
            if (cart.tent) keys.push('tent');
            if (index < keys.length) {
                const key = keys[index];
                if (key === 'tent') cart.tent = null;
                else cart[key].qty = 0;
            }
            updateCart();
        }
        
        document.getElementById('serviceDate')?.addEventListener('change', checkDateAvailability);
        initCartCloseOnOutsideClick();
        loadServices();
        updateCart();
    </script>
</body>
</html>
