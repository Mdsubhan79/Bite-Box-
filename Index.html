<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brio Bite | Welcome</title>
  <link rel="stylesheet" href="tracker.css">
  <link rel="icon" type="image/x-icon" href="briobite.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 
  <style>
    /* YOUR EXISTING STYLES - KEEP THEM ALL */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #092724;
      height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .navbar {
      display: flex;
      justify-content: flex-start;
      padding: 15px 30px;
      z-index: 2;
    }

    .nav-buttons .btn {
      background-color: #004d26;
      border: none;
      color: white;
      padding: 8px 18px;
      margin-left: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s, transform 0.2s;
    }

    .nav-buttons .btn:hover {
      background-color: #008b3e;
      transform: scale(1.05);
    }

    .hero {
      text-align: center;
      z-index: 2;
      animation: fadeIn 1.2s ease-in-out;
    }
    .hadd{
      margin-bottom: 8rem;
    }
    .logo {
      font-family:  'Lucida Handwriting', cursive;
      font-size: 4rem;
      color: #ffd87c;
      text-shadow: 0 0 16px #ffa600, 0 0 25px #ff7700;
      animation: glow 2s infinite alternate;
      
    }

    .tagline {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #ffdd99;
      text-shadow: 0 0 10px #000;
      
    }

    .menu-btn {
      margin-top: 25px;
      background: #e4bf3c;
      border: none;
      box-shadow: 0 1px 8px rgb(199, 188, 37);
      padding: 12px 28px;
      border-top-left-radius: 25px;
      border-bottom-left-radius: 25px;
      border-bottom-right-radius: 20px;
      color: #041a10;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .menu-btn:hover {
      transform: scale(1.1);
      
      background: linear-gradient(90deg, #917513,#8d7210);
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff7b00, 0 0 20px #ff9e00;
      }
      to {
        text-shadow: 0 0 20px #ffb347, 0 0 30px #ffcc33;
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 4.5rem;
      }
      .tagline {
        font-size: 1.2rem;
      }
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero .logo {
      animation: fadeUp 1s ease-out forwards;
      animation-delay: 0.3s;
      opacity: 0;
    }

    .hero .tagline {
      animation: fadeUp 1s ease-out forwards;
      animation-delay: 0.8s;
      opacity: 0;
    }

    .hero .menu-btn {
      animation: fadeUp 1s ease-out forwards;
      animation-delay: 1.5s;
      opacity: 0;
    }

    .profile-container {
      position: relative;
      
    }

    .profile-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #ffd87c;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .profile-icon:hover {
      transform: scale(1.1);
    }

    .profile-panel {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: rgba(10, 40, 35, 0.98);
      box-shadow: 3px 0 10px rgba(0,0,0,0.4);
      color: white;
      padding: 20px;
      transition: right 0.4s ease;
      z-index: 10;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 22px;
      color: #ffd87c;
      cursor: pointer;
    }
    .profile-panel.active {
      left: 0;
    }

    .profile-panel h3 {
      color: #ffd87c;
      font-family: 'Lucida Handwriting', cursive;
    }

    .profile-info p {
      margin: 10px 0;
      font-size: 1rem;
    }

    .logout-btn {
      margin-top: 25px;
      width: 100%;
      background-color: #c51f19;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background-color: #ad221d;
    }
    /* Subscription Details Styles */
    .subscription-section {
      margin-top: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      border: 1px solid #f7c948;
    }

    .subscription-section h4 {
      color: #f7c948;
      margin-bottom: 15px;
      font-size: 1.1rem;
      text-align: center;
    }

    .subscription-details {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .subscription-details p {
      margin: 8px 0;
      font-size: 0.9rem;
    }

    .subscription-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-active {
      background: #28a745;
      color: white;
    }

    .status-pending {
      background: #ffc107;
      color: black;
    }

    .status-inactive {
      background: #dc3545;
      color: white;
    }

    .no-subscription {
      text-align: center;
      color: #ccc;
      font-style: italic;
      padding: 20px 0;
    }
    /* Additional styles for multiple subscription buttons */
    .manage-subscription-btn {
      width: 100%;
      background: #f7c948;
      color: #0c2f2c;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .manage-subscription-btn:hover {
      background: #e4b732;
      transform: translateY(-2px);
    }

    .manage-subscription-btn:first-of-type {
      background: #049e28;
      color: white;
    }

    .manage-subscription-btn:first-of-type:hover {
      background: #218838;
    }

    /* Make sure buttons are properly spaced */
    .subscription-section button {
      margin-bottom: 8px;
    }
    .profile-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9;
      display: none;
    }

    .profile-overlay.active {
      display: block;
    }

    /* ===== TIFFIN MENU BUTTON ===== */

    .tiffin-menu-btn {
      display: inline-block;
      background: linear-gradient(135deg, #e6b42b, #d19f14);
      color: #0c2f2c;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
     
      margin-top: 15px;
    }

    .tiffin-menu-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg,#af8616, #cc980a);
    }

    .tiffin-menu-btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      .tiffin-menu-btn {
        width: 100%;
        text-align: center;
        font-size: 15px;
        padding: 12px;
      }
    }

    .ai-agent-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
    }

    .agent-bubble {
        background: #f7c948;
        color: #0c2f2c;
        padding: 12px 20px;
        border-radius: 20px;
        margin-bottom: 12px;
        position: relative;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        max-width: 250px;
        font-size: 14px;
    }

    .agent-bubble::after {
        content: '';
        position: absolute;
        bottom: -8px;
        right: 25px;
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-top: 10px solid #f7c948;
    }

    .ai-agent-button {
        display: flex;
        align-items: center;
        background: #f7c948;
        padding: 10px 20px;
        border-radius: 50px;
        text-decoration: none;
        color: #0c2f2c;
        font-weight: 600;
        box-shadow: 0 5px 15px rgba(247, 201, 72, 0.4);
        transition: transform 0.2s;
        border: 2px solid #ffd87c;
    }

    .ai-agent-button:hover {
        transform: scale(1.05);
    }

    .agent-avatar {
        width: 35px;
        height: 35px;
        margin-right: 10px;
    }

    .agent-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: white;
        padding: 3px;
    }

    @media (max-width: 768px) {
        .ai-agent-container {
            bottom: 20px;
            right: 20px;
        }
        .agent-bubble {
            display: none;
        }
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<nav class="navbar">
  <div class="profile-container">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         id="profileIcon"
         alt="Profile"
         class="profile-icon"
         onclick="handleProfileClick()">
  </div>
</nav>

<main class="hero">
  <div class="hadd">
    <h1 class="logo">Brio Bite</h1>
    <p class="tagline">Where Every Bite is a Flavor Bomb</p>
  </div>
  <button class="menu-btn" onclick="handleMenuClick()">Check Our Menu</button>
</main>

<footer>
  <p>© 2026 Brio Bite. All rights reserved.</p>
</footer>

<!-- PROFILE PANEL -->
<div class="profile-overlay" id="profileOverlay" onclick="closeProfilePanel()"></div>

<div class="profile-panel" id="profilePanel">
  <div class="profile-header">
    <h3>My Profile</h3>
    <button class="close-btn" id="closeProfileBtn" onclick="closeProfilePanel()">×</button>
  </div>

  <div class="profile-info">
    <p><strong>Name:</strong> <span id="profileName"></span></p>
    <p><strong>Email:</strong> <span id="profileEmail"></span></p>
  </div>

  <div class="subscription-section">
    <h4>My Subscriptions</h4>
    <div id="subscriptionDetails"></div>

    <button class="manage-subscription-btn" onclick="window.location.href='tiffinservice.html'">
      <i class="fas fa-plus"></i> Add New Tiffin Service
    </button>
    <button id="tiffinMenuBtn" class="tiffin-menu-btn" style="display: none;" onclick="openTiffinMenu()">Tiffin Menu</button>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- AI Chef Agent -->
<div class="ai-agent-container">
    <div class="agent-bubble">
        <p>👨‍🍳 <strong>AI Chef</strong></p>
        <p>What ingredients do you have? I'll suggest Indian recipes!</p>
    </div>
    <a href="ai-chef.html" class="ai-agent-button">
        <div class="agent-avatar">
            <img src="https://cdn-icons-png.flaticon.com/512/1995/1995578.png" alt="AI Chef">
        </div>
        <span>Ask AI Chef</span>
    </a>
</div>

<!-- Scripts -->
<script src="auth-check.js"></script>
<script src="tracker-unified.js"></script>

<script>
// ========== PROFILE PANEL FUNCTIONS ==========
function closeProfilePanel() {
    document.getElementById("profilePanel").classList.remove("active");
    document.getElementById("profileOverlay").classList.remove("active");
}

function logout() {
    localStorage.removeItem("biteboxToken");
    localStorage.removeItem("biteboxUser");
    localStorage.removeItem("biteboxAdmin");
    window.location.href = "login.html";
}

function openTiffinMenu() {
    const bookingId = localStorage.getItem("activeBookingId");
    if (bookingId) {
        window.location.href = `maketiffinmenu.html?bookingId=${bookingId}`;
    } else {
        alert("No active tiffin subscription found");
    }
}

// ========== SUBSCRIPTION LOADING ==========
async function loadSubscriptions() {
    if (!isLoggedIn()) return;
    
    try {
        const user = getCurrentUser();
        const res = await fetch("https://bbbackend-bng2.onrender.com/api/tiffin-bookings");
        const bookings = await res.json();

        const subscriptionDetails = document.getElementById("subscriptionDetails");
        const userBookings = bookings.filter(b => b.userName === user?.name);

        if (userBookings.length === 0) {
            subscriptionDetails.innerHTML = "<p class='no-subscription'>No active subscription</p>";
            return;
        }

        subscriptionDetails.innerHTML = userBookings.map(b => `
            <div class="subscription-details">
                <p><strong>Plan:</strong> ${b.planName}</p>
                <p><strong>Price:</strong> ₹${b.price}</p>
                ${b.startDate ? `<p><strong>Start Date:</strong> ${new Date(b.startDate).toLocaleDateString()}</p>` : `<p><strong>Start Date:</strong> Not Started Yet</p>`}
                <p><strong>Status:</strong> 
                    <span class="subscription-status status-${b.status}">
                        ${b.status}
                    </span>
                </p>
                <p><strong>Payment:</strong> ${b.paymentStatus}</p>
            </div>
        `).join("");

    } catch (err) {
        console.log("Subscription load error", err);
    }
}

// ========== TIFFIN SUBSCRIPTION CHECK ==========
async function checkTiffinSubscription() {
    if (!isLoggedIn()) return;
    
    try {
        const user = getCurrentUser();
        const res = await fetch(`${API_BASE}/api/tiffin-bookings`);
        const bookings = await res.json();

        const userBookings = bookings.filter(b => b.userName === user?.name);

        if (userBookings.length > 0) {
            const activeBooking = userBookings[0];
            localStorage.setItem("activeBookingId", activeBooking._id);

            const btn = document.getElementById("tiffinMenuBtn");
            btn.style.display = "block";
        }

    } catch (err) {
        console.log("Tiffin subscription check error", err);
    }
}

// ========== INITIALIZE PAGE ==========
document.addEventListener('DOMContentLoaded', function() {
    // Initialize auth UI
    initAuthUI();
    
    // Check for redirect after login
    checkLoginRedirect();
    
    // Load data if logged in
    if (isLoggedIn()) {
        loadSubscriptions();
        checkTiffinSubscription();
    }
});
</script>
<script>
 
function handleMenuClick() {
    if (!isLoggedIn()) {
        sessionStorage.setItem("intendedAction", "menu");
        if (confirm("Please login or signup to continue. Would you like to login now?")) {
            setTimeout(() => {
                window.location.href = "login.html";
            }, 100);
        }
    } else {
        window.location.href = "services.html";
    }
}
</script>
</body>
</html>
