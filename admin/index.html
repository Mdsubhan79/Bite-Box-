<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brio Bite Admin</title>
     <link rel="icon" type="image/x-icon" href="briobite.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Brio Bite</h2>
    <ul>
      <li onclick="loadPage('dashboard')">Dashboard</li>
      <li onclick="loadPage('veg')">Veg Menu</li>
      <li onclick="loadPage('nonveg')">Non-Veg Menu</li>
      <li onclick="loadPage('tiffin')">Tiffin Services</li>
      <li onclick="loadPage('tiffinBookings')">Tiffin Bookings</li>
      <li onclick="loadPage('defaultMenu')">Set Tiffin Menu</li>
      <li onclick="loadPage('orders')">Orders</li>
      <li onclick="loadPage('users')">Users</li>
      <li onclick="loadPage('settings')">Settings</li>
    </ul>
  </aside>

  <!-- Content -->
  <main class="content" id="content">
    <h1>Admin Dashboard</h1>
    <p>Select a section</p>
  </main>
<!-- Add this in the content area where you want orders to appear -->
<div class="stats-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;" id="orderStats"></div>

<div style="margin: 20px 0; display: flex; gap: 10px;">
    <select id="statusFilter" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
        <option value="all">All Orders</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="preparing">Preparing</option>
        <option value="out-for-delivery">Out for Delivery</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
    </select>
    
    <select id="dateFilter" style="padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
        <option value="all">All Time</option>
        <option value="today">Today</option>
    </select>
</div>

<div id="ordersList" style="margin-top: 20px;"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
