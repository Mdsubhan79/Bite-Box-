<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Brio Bite Admin</title>
  <link rel="icon" type="image/x-icon" href="briobite.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
  <div class="mobile-menu-toggle" id="mobileMenuToggle">
    <i class="fas fa-bars"></i>
  </div>
</header>

  <div class="admin-wrapper">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-utensils"></i> Brio Bite</h2>
         
      </div>
      <ul>
        <li onclick="loadPage('dashboard')"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></li>
        <li onclick="loadPage('veg')"><i class="fas fa-leaf"></i> <span>Veg Menu</span></li>
        <li onclick="loadPage('nonveg')"><i class="fas fa-drumstick-bite"></i> <span>Non-Veg Menu</span></li>
        <li onclick="loadPage('orders')"><i class="fas fa-shopping-cart"></i> <span>Orders</span></li>
        <li onclick="loadPage('tiffin')"><i class="fas fa-box"></i> <span>Tiffin Services</span></li>
        <li onclick="loadPage('tiffinBookings')"><i class="fas fa-calendar-check"></i> <span>Tiffin Bookings</span></li>
        <li onclick="loadPage('defaultMenu')"><i class="fas fa-edit"></i> <span>Set Tiffin Menu</span></li>
        <li onclick="loadPage('catering')"><i class="fas fa-concierge-bell"></i><span>Catering Services</span></li>
        <li onclick="loadPage('users')"><i class="fas fa-users"></i> <span>Users</span></li>
        <li onclick="loadPage('settings')"><i class="fas fa-cog"></i> <span>Settings</span></li>
      </ul>
      <div class="sidebar-footer">
        <button onclick="logoutAdmin()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>

    <!-- Content -->
    <main class="content" id="content">
      <div class="content-header">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="header-actions">
          <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
        </div>
      </div>
      <div class="content-body" id="contentBody">
        <!-- Dynamic content loads here -->
      </div>
    </main>
  </div>

  <script src="admin.js"></script>
  <script>
 
const sidebar = document.getElementById('sidebar');
const toggle = document.getElementById('mobileMenuToggle');

toggle.addEventListener('click', function() {
  sidebar.classList.add('active');
  toggle.style.display = "none"; // hide toggle
});

document.addEventListener('click', function(e) {
  if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
    sidebar.classList.remove('active');
    toggle.style.display = "flex"; // show toggle again
  }
});
  </script>
</body>
</html>
