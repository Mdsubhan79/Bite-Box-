<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Order Details - Brio Bite</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="icon" type="image/x-icon" href="briobite.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg,#10332F 0%, #0a2c28 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .order-container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h2 {
            color: #10332F;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        .order-items {
            margin: 30px 0;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            padding: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        /* ========== COMPACT FORM FIELDS CSS - SMALLER & SPACE EFFICIENT ========== */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #1b1b1b;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
        }

        .form-group label i {
            margin-right: 6px;
            color: #023f11;
            font-size: 0.75rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s ease;
            background: #fefefe;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #bbb;
            font-size: 0.8rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
            line-height: 1.4;
        }


        @media (max-width: 320px) {
            .form-group {
                margin-bottom: 10px;
            }
            
            .form-group label {
                font-size: 0.7rem;
                margin-bottom: 4px;
            }
            
            .form-group label i {
                font-size: 0.65rem;
                margin-right: 4px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 6px 8px;
                font-size: 0.75rem;
                border-radius: 6px;
                border-width: 1.5px;
            }
            
            .form-group input::placeholder,
            .form-group textarea::placeholder {
                font-size: 0.7rem;
            }
            
            .form-group textarea {
                min-height: 55px;
            }
        }
        
 
        @media (min-width: 321px) and (max-width: 375px) {
            .form-group {
                margin-bottom: 11px;
            }
            
            .form-group label {
                font-size: 0.73rem;
                margin-bottom: 4px;
            }
            
            .form-group label i {
                font-size: 0.7rem;
                margin-right: 5px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 7px 10px;
                font-size: 0.78rem;
                border-radius: 7px;
            }
            
            .form-group input::placeholder,
            .form-group textarea::placeholder {
                font-size: 0.73rem;
            }
            
            .form-group textarea {
                min-height: 60px;
            }
        }
        

        @media (min-width: 376px) and (max-width: 425px) {
            .form-group {
                margin-bottom: 12px;
            }
            
            .form-group label {
                font-size: 0.75rem;
                margin-bottom: 5px;
            }
            
            .form-group label i {
                font-size: 0.72rem;
                margin-right: 5px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 7px 11px;
                font-size: 0.8rem;
                border-radius: 7px;
            }
            
            .form-group input::placeholder,
            .form-group textarea::placeholder {
                font-size: 0.75rem;
            }
            
            .form-group textarea {
                min-height: 62px;
            }
        }
        
    
        @media (min-width: 426px) and (max-width: 568px) {
            .form-group {
                margin-bottom: 12px;
            }
            
            .form-group label {
                font-size: 0.78rem;
                margin-bottom: 5px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 8px 12px;
                font-size: 0.82rem;
            }
            
            .form-group textarea {
                min-height: 65px;
            }
        }
        
 
        @media (min-width: 569px) and (max-width: 768px) {
            .form-group {
                margin-bottom: 13px;
            }
            
            .form-group label {
                font-size: 0.8rem;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 8px 12px;
                font-size: 0.84rem;
            }
            
            .form-group textarea {
                min-height: 68px;
            }
        }
        
       
        @media (min-width: 769px) and (max-width: 1024px) {
            .form-group {
                margin-bottom: 14px;
            }
            
            .form-group label {
                font-size: 0.82rem;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 9px 13px;
                font-size: 0.86rem;
            }
        }
        
       
        @media (min-width: 1025px) and (max-width: 1440px) {
            .form-group {
                margin-bottom: 15px;
            }
            
            .form-group label {
                font-size: 0.84rem;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 9px 14px;
                font-size: 0.88rem;
            }
        }
        

        @media (min-width: 1441px) {
            .form-group {
                margin-bottom: 16px;
            }
            
            .form-group label {
                font-size: 0.88rem;
                margin-bottom: 6px;
            }
            
            .form-group label i {
                font-size: 0.85rem;
                margin-right: 7px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 10px 15px;
                font-size: 0.9rem;
                border-radius: 9px;
            }
            
            .form-group textarea {
                min-height: 75px;
            }
        }
        
      
        @media (max-height: 500px) and (orientation: landscape) {
            .form-group {
                margin-bottom: 8px;
            }
            
            .form-group label {
                font-size: 0.68rem;
                margin-bottom: 3px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 5px 8px;
                font-size: 0.72rem;
            }
            
            .form-group textarea {
                min-height: 45px;
            }
        }
        
      
        @media (max-width: 260px) {
            .form-group {
                margin-bottom: 8px;
            }
            
            .form-group label {
                font-size: 0.62rem;
                margin-bottom: 3px;
            }
            
            .form-group label i {
                font-size: 0.58rem;
                margin-right: 3px;
            }
            
            .form-group input, 
            .form-group textarea {
                padding: 5px 6px;
                font-size: 0.68rem;
                border-radius: 5px;
                border-width: 1px;
            }
            
            .form-group input::placeholder,
            .form-group textarea::placeholder {
                font-size: 0.62rem;
            }
            
            .form-group textarea {
                min-height: 48px;
            }
        }
        
    
        .total-price {
            font-size: 24px;
            font-weight: bold;
            color: #106323;
            text-align: right;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .order-now-btn {
            background: linear-gradient(135deg, #F4D35E 0%, #10332F 100%);
            color: #10332F;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .order-now-btn:hover {
            transform: translateY(-2px);
        }

        
        .floating-tracker {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            border-radius: 50%;
            cursor: move;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            animation: pulse 2s infinite;
            user-select: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tracker-popup {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 350px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 10000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tracker-popup.active {
            display: block;
        }

        .popup-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-header button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .popup-content {
            padding: 20px;
        }

        .progress-bar {
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #4CAF50);
            transition: width 0.5s ease;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #666;
            margin: 10px 0;
        }

        .step {
            text-align: center;
            flex: 1;
        }

        .step.active {
            color: #28a745;
            font-weight: bold;
        }

        .timer {
            text-align: center;
            margin: 15px 0;
            font-size: 1.2em;
            color: #ff6b6b;
            font-weight: bold;
        }

        .cancel-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 15px;
        }

        .cancel-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .reorder-btn {
            background: #146126;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }

        .admin-message {
            margin: 15px 0;
            padding: 12px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            display: none;
        }

        .back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #ff5252;
            transform: translateX(-5px);
        }

       
        @media (max-width: 768px) {
            .order-container {
                margin: 20px;
                padding: 20px;
            }

            .tracker-popup {
                width: 300px;
                right: 10px;
                bottom: 100px;
            }
        }
        
        @media (max-width: 480px) {
            .order-container {
                padding: 16px;
                margin: 15px;
            }
            
            h2 {
                font-size: 1.5em;
                margin-bottom: 20px;
            }
            
            .order-items {
                padding: 12px;
                margin: 20px 0;
            }
            
            .order-item {
                padding: 10px;
            }
            
            .total-price {
                font-size: 20px;
                padding: 12px;
            }
            
            .order-now-btn {
                padding: 12px 20px;
                font-size: 1em;
            }
            
            .floating-tracker {
                width: 55px;
                height: 55px;
                font-size: 24px;
                bottom: 20px;
                right: 20px;
            }
            
            .tracker-popup {
                width: 280px;
                right: 8px;
                bottom: 85px;
            }
            
            .back-btn {
                padding: 8px 18px;
                font-size: 0.85rem;
                bottom: 15px;
                left: 15px;
            }
        }
        
        @media (max-width: 360px) {
            .order-container {
                padding: 12px;
            }
            
            h2 {
                font-size: 1.3em;
            }
            
            .total-price {
                font-size: 18px;
                text-align: center;
            }
        }
        
        @media (max-width: 280px) {
            .order-container {
                padding: 10px;
            }
            
            h2 {
                font-size: 1.1em;
            }
            
            .total-price {
                font-size: 16px;
            }
            
            .order-now-btn {
                padding: 10px 15px;
                font-size: 0.9em;
            }
            
            .back-btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="order-container">
        <h2><i class="fas fa-shopping-bag"></i> Complete Your Order</h2>
        
        <div class="order-items" id="orderItems"></div>
        
        <form id="orderForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number *</label>
                <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Complete Address *</label>
                <textarea id="address" rows="3" placeholder="House/Flat No., Street, Area" required></textarea>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-flag"></i> Landmark *</label>
                <input type="text" id="landmark" placeholder="Nearby landmark">
            </div>
            
            <div class="total-price" id="totalPrice">
                Total: ₹0
            </div>
            
            <button type="submit" class="order-now-btn">
                <i class="fas fa-check-circle"></i> Place Order
            </button>
        </form>
    </div>
<script src="script.js"></script>
<script src="orderdetail.js"></script>
<script src="tracker-unified.js"></script>
    
</body>
</html>
