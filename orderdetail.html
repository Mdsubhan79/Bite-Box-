<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Brio Bite</title>
    <link rel="stylesheet" href="tracker.css">
    <link rel="icon" type="image/x-icon" href="briobite.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="order-container">
        <h2><i class="fas fa-shopping-bag"></i> Complete Your Order</h2>
        
        <div class="order-items" id="orderItems"></div>
        
        <form id="orderForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number *</label>
                <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Complete Address *</label>
                <textarea id="address" rows="3" placeholder="House/Flat No., Street, Area" required></textarea>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-flag"></i> Landmark (Optional)</label>
                <input type="text" id="landmark" placeholder="Nearby landmark">
            </div>
            
            <div class="total-price" id="totalPrice">
                Total: ₹0
            </div>
            
            <button type="submit" class="order-now-btn">
                <i class="fas fa-check-circle"></i> Place Order
            </button>
        </form>
    </div>

    <!-- Floating Tracker -->
    <div class="floating-tracker" id="floatingTracker">
        <i class="fas fa-utensils"></i>
    </div>

    <!-- Tracker Popup -->
    <div class="tracker-popup" id="trackerPopup">
        <div class="popup-header">
            <span><i class="fas fa-shopping-bag"></i> Your Order</span>
            <button id="closePopup"><i class="fas fa-times"></i></button>
        </div>
        <div class="popup-content">
            <div class="timer" id="cancellationTimer"></div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            
            <div class="progress-steps" id="progressSteps"></div>
            
            <div id="orderDetails" style="margin: 20px 0;"></div>
            
            <div class="admin-message" id="adminMessage"></div>
            
            <button class="cancel-btn" id="cancelOrderBtn">
                <i class="fas fa-times-circle"></i> Cancel Order
            </button>
            
            <button class="reorder-btn" id="reorderBtn">
                <i class="fas fa-redo-alt"></i> Reorder Now
            </button>
        </div>
    </div>

    <button onclick="window.history.back()" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </button>

    <script src="script.js"></script>
    <script src="orderdetail.js"></script>
    <script src="tracker.js"></script>
</body>
</html>
