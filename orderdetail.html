<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Order Details | Brio Bite</title>
    <!-- Favicon & Fonts -->
    <link rel="icon" type="image/x-icon" href="briobite.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        /* ---------- GLOBAL RESET (preserve original color DNA) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #10332F 0%, #0a2c28 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Inter', 'Poppins', sans-serif;
        }

        /* refined container – same white background, elevated subtle shadow */
        .order-container {
            max-width: 950px;
            margin: 40px auto;
            background: white;
            border-radius: 32px;
            padding: 32px 34px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
        }

        /* heading style preserved but refined spacing */
        h2 {
            color: #10332F;
            margin-bottom: 28px;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        h2 i {
            color: #F4D35E;
            background: #10332F10;
            padding: 6px;
            border-radius: 50%;
        }

        /* order items section - cleaner borders */
        .order-items {
            margin: 28px 0 32px 0;
            border: 1.5px solid #eef2f0;
            border-radius: 24px;
            background: #ffffff;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid #edf2f0;
            transition: background 0.15s;
        }
        .order-item:last-child {
            border-bottom: none;
        }

        /* item name & details */
        .item-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 2;
        }
        .item-name {
            font-weight: 700;
            font-size: 1.08rem;
            color: #1e2f2c;
            letter-spacing: -0.2px;
        }
        .item-meta {
            font-size: 0.8rem;
            color: #6c7a76;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .item-quantity {
            background: #f0f4f2;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            color: #10332F;
        }
        .item-price {
            font-weight: 700;
            color: #106323;
            background: #e9f5ec;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        /* Form modernisation – same colors but fresher spacing */
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e3a;
            font-size: 0.9rem;
        }
        .form-group label i {
            color: #F4D35E;
            width: 22px;
            font-size: 1rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e0e8e4;
            border-radius: 20px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #fff;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #F4D35E;
            box-shadow: 0 0 0 3px rgba(244, 211, 94, 0.2);
        }

        /* total price card – preserve gradient touch */
        .total-price {
            font-size: 26px;
            font-weight: 800;
            color: #106323;
            text-align: right;
            margin: 24px 0 28px;
            padding: 18px 24px;
            background: #f9fbf9;
            border-radius: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2efe4;
        }
        .total-label {
            font-size: 1rem;
            font-weight: 500;
            color: #2b5a4b;
            letter-spacing: 0.3px;
        }

        /* main CTA – original gradient (F4D35E → 10332F) */
        .order-now-btn {
            background: linear-gradient(135deg, #F4D35E 0%, #10332F 100%);
            color: white;
            padding: 16px 28px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 18px rgba(16, 51, 47, 0.2);
        }
        .order-now-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.2);
            filter: brightness(1.02);
        }

        /* Floating tracker (same style, draggable) */
        .floating-tracker {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            border-radius: 50%;
            cursor: move;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
            user-select: none;
            transition: transform 0.1s;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
            50% { transform: scale(1.08); box-shadow: 0 10px 28px rgba(0,0,0,0.4);}
            100% { transform: scale(1);}
        }

        /* tracker popup */
        .tracker-popup {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 360px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            z-index: 10000;
            display: none;
            animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow: hidden;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .tracker-popup.active {
            display: block;
        }
        .popup-header {
            padding: 18px 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .popup-header span {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .popup-header button {
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .popup-content {
            padding: 22px;
        }
        .progress-bar {
            height: 10px;
            background: #eef2f0;
            border-radius: 12px;
            overflow: hidden;
            margin: 18px 0 12px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #4caf50);
            transition: width 0.4s ease;
            width: 0%;
            border-radius: 12px;
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 500;
            color: #6b7b76;
            margin-top: 8px;
        }
        .step {
            text-align: center;
            flex: 1;
        }
        .step.active {
            color: #28a745;
            font-weight: 800;
        }
        .timer {
            text-align: center;
            margin: 18px 0 12px;
            font-size: 1.2rem;
            font-weight: 700;
            background: #fff3e0;
            padding: 10px;
            border-radius: 50px;
            color: #dc7a2c;
        }
        .cancel-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: background 0.2s;
        }
        .cancel-btn:disabled {
            background: #b0b9b5;
            cursor: not-allowed;
        }
        .reorder-btn {
            background: #146126;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: none;
            transition: background 0.2s;
        }
        .admin-message {
            margin: 15px 0;
            padding: 12px 14px;
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 18px;
            font-size: 0.85rem;
            display: none;
            color: #866a1c;
        }
        .back-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.25s ease;
            text-decoration: none;
            font-size: 0.95rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            z-index: 110;
        }
        .back-btn:hover {
            background: #ff5252;
            transform: translateX(-5px);
        }
        /* empty cart state */
        .empty-cart-message {
            text-align: center;
            padding: 40px 20px;
            color: #6b7b76;
        }
        @media (max-width: 680px) {
            .order-container {
                padding: 20px;
                margin: 20px;
            }
            .tracker-popup {
                width: 300px;
                right: 12px;
                bottom: 100px;
            }
            .floating-tracker {
                width: 60px;
                height: 60px;
                font-size: 26px;
                bottom: 20px;
                right: 20px;
            }
            .total-price {
                font-size: 22px;
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>

<div class="order-container">
    <h2><i class="fas fa-shopping-bag"></i> Complete Your Order</h2>
    
    <div class="order-items" id="orderItems">
        <!-- dynamic items will load here -->
        <div class="empty-cart-message">
            <i class="fas fa-shopping-cart" style="font-size: 2rem; opacity: 0.6;"></i>
            <p style="margin-top: 12px;">Your cart is empty. Add some delicious items!</p>
        </div>
    </div>
    
    <form id="orderForm">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required autocomplete="name">
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-phone"></i> Phone Number *</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt"></i> Complete Address *</label>
            <textarea id="address" rows="3" placeholder="House/Flat No., Street, Area / Colony" required></textarea>
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-flag"></i> Landmark (optional)</label>
            <input type="text" id="landmark" placeholder="Nearby landmark for easy delivery">
        </div>
        
        <div class="total-price" id="totalPrice">
            <span class="total-label"><i class="fas fa-rupee-sign"></i> TOTAL AMOUNT</span>
            <span id="totalAmountSpan">₹0</span>
        </div>
        
        <button type="submit" class="order-now-btn">
            <i class="fas fa-check-circle"></i> Place Secure Order
        </button>
    </form>
</div>


<div class="floating-tracker" id="floatingTracker">
    <i class="fas fa-truck-moving"></i>
</div>
<div class="tracker-popup" id="trackerPopup">
    <div class="popup-header">
        <span><i class="fas fa-shipping-fast"></i> Live Order Tracker</span>
        <button id="closePopupBtn">&times;</button>
    </div>
    <div class="popup-content">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-steps" id="progressSteps">
            <div class="step" data-step="0">Order Placed</div>
            <div class="step" data-step="1">Preparing</div>
            <div class="step" data-step="2">On the way</div>
            <div class="step" data-step="3">Delivered</div>
        </div>
        <div class="timer" id="timerDisplay">--:--</div>
        <div class="admin-message" id="adminMessageBox"></div>
        <button class="cancel-btn" id="cancelOrderBtn">Cancel Order</button>
        <button class="reorder-btn" id="reorderBtn">Reorder Same Items</button>
    </div>
</div>



<script>
    // ---------- HELPER FUNCTIONS & GLOBAL STATE ----------
    let currentOrderId = localStorage.getItem('activeOrderId') || null;
    let orderStatus = localStorage.getItem('orderStatus') || 'pending';
    let orderItemsCache = [];
    let orderTotalCache = 0;
    let cancelTimeout = null;
    let timerInterval = null;

    // Load cart data from localStorage (cart items)
    function loadCartItems() {
        const storedCart = localStorage.getItem('brio_cart');
        if (storedCart) {
            try {
                return JSON.parse(storedCart);
            } catch(e) { return []; }
        }
        return [];
    }

    function displayOrderItems() {
        const container = document.getElementById('orderItems');
        const cart = loadCartItems();
        if (!cart || cart.length === 0) {
            container.innerHTML = `<div class="empty-cart-message">
                <i class="fas fa-shopping-cart" style="font-size: 2rem; opacity: 0.6;"></i>
                <p style="margin-top: 12px;">Your cart is empty. Add some delicious items!</p>
            </div>`;
            document.getElementById('totalAmountSpan').innerText = '₹0';
            return;
        }
        
        let total = 0;
        let itemsHtml = '';
        cart.forEach((item, idx) => {
            const itemPrice = item.price || 0;
            const qty = item.quantity || 1;
            const subtotal = itemPrice * qty;
            total += subtotal;
            itemsHtml += `
                <div class="order-item" data-idx="${idx}">
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-meta">
                            <span class="item-quantity"><i class="fas fa-times-circle"></i> Qty: ${qty}</span>
                            <span class="item-price">₹${itemPrice} each</span>
                        </div>
                    </div>
                    <div class="item-subtotal" style="font-weight:700; color:#10332F;">₹${subtotal}</div>
                </div>
            `;
        });
        container.innerHTML = itemsHtml;
        document.getElementById('totalAmountSpan').innerHTML = `₹${total}`;
        orderTotalCache = total;
        orderItemsCache = [...cart];
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // order placement logic (store order + reset cart)
    function placeOrder(event) {
        event.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const address = document.getElementById('address').value.trim();
        const landmark = document.getElementById('landmark').value.trim();

        if (!fullName || !phone || !address) {
            alert('Please fill all required fields: Name, Phone, Address');
            return;
        }
        if (!/^\d{10}$/.test(phone)) {
            alert('Phone number must be 10 digits');
            return;
        }
        const cart = loadCartItems();
        if (cart.length === 0) {
            alert('Your cart is empty! Add items before placing order.');
            return;
        }

        const orderId = 'ORD' + Date.now() + Math.floor(Math.random() * 1000);
        const orderData = {
            orderId: orderId,
            customer: { fullName, phone, address, landmark },
            items: cart,
            totalAmount: orderTotalCache,
            orderDate: new Date().toISOString(),
            status: 'confirmed',   // 'confirmed' => tracker step 0
            step: 0,
            placedAt: Date.now()
        };

        // store in localStorage as current live order
        localStorage.setItem('activeOrderId', orderId);
        localStorage.setItem('currentOrderData', JSON.stringify(orderData));
        localStorage.setItem('orderStatus', 'confirmed');
        localStorage.setItem('orderStep', '0');
        // clear cart after order placed
        localStorage.removeItem('brio_cart');

        // update UI & reset form but show success
        displayOrderItems();   // empty cart view
        document.getElementById('orderForm').reset();
        
        alert(`✅ Order placed successfully!\nOrder ID: ${orderId}\nTrack your order via the floating tracker.`);
        initTrackerFromStorage();
        showFloatingTracker(true);
        // additional: open tracker popup automatically for better UX
        document.getElementById('trackerPopup').classList.add('active');
        updateTrackerUI();
    }

    // TRACKER LOGIC (Unified)
    function initTrackerFromStorage() {
        const activeId = localStorage.getItem('activeOrderId');
        if (!activeId) {
            document.getElementById('floatingTracker').style.display = 'none';
            document.getElementById('trackerPopup').classList.remove('active');
            if (timerInterval) clearInterval(timerInterval);
            return;
        }
        document.getElementById('floatingTracker').style.display = 'flex';
        // retrieve step
        let step = parseInt(localStorage.getItem('orderStep') || '0');
        if (isNaN(step)) step = 0;
        updateProgressStep(step);
        startTimerBasedOnStep(step);
        updateCancelButtonState(step);
        // show/hide reorder
        const reorderBtn = document.getElementById('reorderBtn');
        if (step === 3) {
            reorderBtn.style.display = 'block';
            document.getElementById('cancelOrderBtn').style.display = 'none';
        } else {
            reorderBtn.style.display = 'none';
            document.getElementById('cancelOrderBtn').style.display = 'block';
        }
        // admin message simulation
        const adminMsgDiv = document.getElementById('adminMessageBox');
        if (step === 1) adminMsgDiv.innerHTML = '👨‍🍳 Chef is preparing your meal!';
        else if (step === 2) adminMsgDiv.innerHTML = '🛵 Rider assigned — arriving soon!';
        else if (step === 3) adminMsgDiv.innerHTML = '🎉 Delivered! Enjoy your meal.';
        else adminMsgDiv.innerHTML = '✅ Order confirmed. We’ll notify you.';
        adminMsgDiv.style.display = 'block';
    }

    function updateProgressStep(step) {
        const fillPercent = (step / 3) * 100;
        document.getElementById('progressFill').style.width = fillPercent + '%';
        const stepsDivs = document.querySelectorAll('.step');
        stepsDivs.forEach((el, idx) => {
            if (idx <= step) el.classList.add('active');
            else el.classList.remove('active');
        });
        localStorage.setItem('orderStep', step);
        if (step === 3) {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timerDisplay').innerHTML = '✅ Delivered!';
            document.getElementById('cancelOrderBtn').disabled = true;
        } else {
            document.getElementById('cancelOrderBtn').disabled = false;
        }
    }

    function startTimerBasedOnStep(step) {
        if (timerInterval) clearInterval(timerInterval);
        if (step >= 3) return;
        let remainingSeconds = 0;
        const placedTime = localStorage.getItem('orderPlacedTimestamp');
        const now = Date.now();
        let elapsed = 0;
        if (placedTime) {
            elapsed = Math.floor((now - parseInt(placedTime)) / 1000);
        } else {
            localStorage.setItem('orderPlacedTimestamp', Date.now().toString());
        }
       
        const totalEstimate = 1500;
        const startOffset = step * 500; 
        let targetRemaining = totalEstimate - elapsed;
        if (targetRemaining < 0) targetRemaining = 0;
        remainingSeconds = targetRemaining;
        if (remainingSeconds <= 0 && step < 3) {
            // advance steps automatically based on elapsed time
            let newStep = Math.min(3, Math.floor(elapsed / 500));
            if (newStep > step) {
                localStorage.setItem('orderStep', newStep);
                updateProgressStep(newStep);
                step = newStep;
                remainingSeconds = totalEstimate - elapsed;
                if (remainingSeconds < 0) remainingSeconds = 0;
            }
        }
        function updateTimer() {
            if (step >= 3) {
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('timerDisplay').innerHTML = '🎉 Delivered!';
                return;
            }
            let storedStep = parseInt(localStorage.getItem('orderStep') || '0');
            if (storedStep !== step) {
                step = storedStep;
                updateProgressStep(step);
                if (step >= 3) { clearInterval(timerInterval); document.getElementById('timerDisplay').innerHTML = 'Delivered ✅'; return; }
            }
            let nowSec = Math.floor((Date.now() - parseInt(localStorage.getItem('orderPlacedTimestamp') || Date.now())) / 1000);
            let remain = totalEstimate - nowSec;
            if (remain <= 0) {
                if (step < 3) {
                    let newStep = Math.min(3, step+1);
                    localStorage.setItem('orderStep', newStep);
                    updateProgressStep(newStep);
                    step = newStep;
                    if (step === 3) { clearInterval(timerInterval); document.getElementById('timerDisplay').innerHTML = 'Delivered!'; return; }
                }
                remain = 0;
            }
            let mins = Math.floor(remain / 60);
            let secs = remain % 60;
            document.getElementById('timerDisplay').innerHTML = `⏱️ Est. ${mins}:${secs < 10 ? '0'+secs : secs} left`;
        }
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateCancelButtonState(step) {
        const cancelBtn = document.getElementById('cancelOrderBtn');
        if (step >= 2) {
            cancelBtn.disabled = true;
            cancelBtn.innerText = 'Cannot cancel (order in progress)';
        } else {
            cancelBtn.disabled = false;
            cancelBtn.innerText = 'Cancel Order';
        }
    }

    function cancelCurrentOrder() {
        const activeId = localStorage.getItem('activeOrderId');
        if (!activeId) return;
        const step = parseInt(localStorage.getItem('orderStep') || '0');
        if (step >= 2) {
            alert('Order already out for delivery — cannot cancel now.');
            return;
        }
        if (confirm('Are you sure you want to cancel this order?')) {
            localStorage.removeItem('activeOrderId');
            localStorage.removeItem('currentOrderData');
            localStorage.removeItem('orderStatus');
            localStorage.removeItem('orderStep');
            localStorage.removeItem('orderPlacedTimestamp');
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('floatingTracker').style.display = 'none';
            document.getElementById('trackerPopup').classList.remove('active');
            alert('Order cancelled successfully.');
            // optional: reload page to reset view
            location.reload();
        }
    }

    function reorderItems() {
        const orderDataRaw = localStorage.getItem('currentOrderData');
        if (!orderDataRaw) {
            alert('No previous order data found.');
            return;
        }
        try {
            const order = JSON.parse(orderDataRaw);
            const items = order.items;
            if (items && items.length) {
                localStorage.setItem('brio_cart', JSON.stringify(items));
                alert('Items added to cart! Redirecting to menu...');
                window.location.href = 'menu.html';
            } else {
                alert('No items to reorder.');
            }
        } catch(e) { alert('Error'); }
    }

    function showFloatingTracker(show) {
        const tracker = document.getElementById('floatingTracker');
        tracker.style.display = show ? 'flex' : 'none';
    }

    function updateTrackerUI() {
        const activeId = localStorage.getItem('activeOrderId');
        if (!activeId) {
            showFloatingTracker(false);
            document.getElementById('trackerPopup').classList.remove('active');
            return;
        }
        showFloatingTracker(true);
        let step = parseInt(localStorage.getItem('orderStep') || '0');
        updateProgressStep(step);
        startTimerBasedOnStep(step);
        updateCancelButtonState(step);
        const adminDiv = document.getElementById('adminMessageBox');
        if (step === 0) adminDiv.innerHTML = '📋 Order confirmed — preparing soon';
        else if (step === 1) adminDiv.innerHTML = '🔥 Cooking in progress';
        else if (step === 2) adminDiv.innerHTML = '🚚 Out for delivery!';
        else adminDiv.innerHTML = '🍽️ Delivered — enjoy!';
        adminDiv.style.display = 'block';
        const reorderBtn = document.getElementById('reorderBtn');
        if (step === 3) reorderBtn.style.display = 'block';
        else reorderBtn.style.display = 'none';
    }

    // DRAG functionality for floating tracker
    function makeDraggable(element) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        element.onmousedown = dragMouseDown;
        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }
        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            let top = element.offsetTop - pos2;
            let left = element.offsetLeft - pos1;
            if (top < 0) top = 0;
            if (left < 0) left = 0;
            if (top + element.offsetHeight > window.innerHeight) top = window.innerHeight - element.offsetHeight;
            if (left + element.offsetWidth > window.innerWidth) left = window.innerWidth - element.offsetWidth;
            element.style.top = top + 'px';
            element.style.left = left + 'px';
            element.style.bottom = 'auto';
            element.style.right = 'auto';
        }
        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    // EVENT LISTENERS
    document.getElementById('orderForm').addEventListener('submit', placeOrder);
    document.getElementById('cancelOrderBtn').addEventListener('click', cancelCurrentOrder);
    document.getElementById('reorderBtn').addEventListener('click', reorderItems);
    document.getElementById('closePopupBtn').addEventListener('click', () => {
        document.getElementById('trackerPopup').classList.remove('active');
    });
    document.getElementById('floatingTracker').addEventListener('click', (e) => {
        e.stopPropagation();
        const popup = document.getElementById('trackerPopup');
        popup.classList.toggle('active');
        if (popup.classList.contains('active')) updateTrackerUI();
    });

    window.addEventListener('load', () => {
        displayOrderItems();
        initTrackerFromStorage();
        makeDraggable(document.getElementById('floatingTracker'));
        // if order exists, enable popup updates
        if (localStorage.getItem('activeOrderId')) {
            updateTrackerUI();
        }
    });
</script>
