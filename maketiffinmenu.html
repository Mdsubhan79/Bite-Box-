<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make Tiffin Menu</title>

<style>

/* ========= GLOBAL ========= */

body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* ========= DAY CARD ========= */

.day-card {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  overflow: hidden;
}

.day-header {
  padding: 15px;
  background: #0c2f2c;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.day-content {
  display: none;
  padding: 15px;
}

.day-content.active {
  display: block;
}

/* ========= FORM ========= */

.meal-section {
  margin-bottom: 20px;
}

.meal-section h4 {
  margin-bottom: 5px;
}

select, input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  padding: 12px 20px;
  background: #e0a500;
  color: #0c2f2c;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #ffbb00;
}

/* ========= RESPONSIVE ========= */

@media (min-width: 768px) {

  .meal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

}

</style>
</head>

<body>

<div class="container">
<h1>Make Your Tiffin Menu As You Wish</h1>


<div id="summarySection" style="display:none;">
  <div id="summaryBox"></div>
</div>

<div id="menuSection" style="display:none;">
  <div id="menuContainer"></div>
 <div style="text-align: center; margin-top: 20px;">
  <button id="saveMenuBtn">Save Menu</button>
 </div>
</div>

<button id="remakeBtn" style="display:none;">
  Reset Menu
</button>
<!-- Floating Order Tracker -->
<div class="floating-tracker" id="floatingTracker">
    <i class="fas fa-utensils"></i>
</div>

<!-- Tracker Popup -->
<div class="tracker-popup" id="trackerPopup">
    <div class="popup-header">
        <span><i class="fas fa-shopping-bag"></i> Your Order</span>
        <button id="closePopup"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-content">
        <div class="timer" id="cancellationTimer"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        
        <div class="progress-steps" id="progressSteps"></div>
        
        <div id="orderDetails" style="margin: 20px 0;"></div>
        
        <div class="admin-message" id="adminMessage"></div>
        
        <button class="cancel-btn" id="cancelOrderBtn">Cancel Order</button>
        <button class="reorder-btn" id="reorderBtn" style="display: none;">Reorder Now</button>
    </div>
</div>

<style>
.floating-tracker {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
    border-radius: 50%;
    cursor: move;
    z-index: 9999;
    display: flex !important; /* Force display */
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
    box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
    animation: pulse 2s infinite;
}

.tracker-popup {
    position: fixed;
    bottom: 120px;
    right: 30px;
    width: 350px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    z-index: 10000;
    display: none;
}

.tracker-popup.active {
    display: block;
}

.popup-header {
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 20px 20px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.popup-header button {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.popup-content {
    padding: 20px;
}

.progress-bar {
    height: 10px;
    background: #f0f0f0;
    border-radius: 5px;
    overflow: hidden;
    margin: 20px 0;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #28a745, #4CAF50);
    transition: width 0.5s ease;
}

.progress-steps {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #666;
    margin: 10px 0;
}

.step.active {
    color: #28a745;
    font-weight: bold;
}

.timer {
    text-align: center;
    margin: 15px 0;
    font-size: 1.2em;
    color: #ff6b6b;
    font-weight: bold;
}

.cancel-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
    margin-top: 15px;
}

.cancel-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.reorder-btn {
    background: #28a745;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;
    margin-top: 10px;
}

.admin-message {
    margin: 15px 0;
    padding: 12px;
    background: #fff3cd;
    border-left: 4px solid #ffc107;
    border-radius: 5px;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>

<script>
// Simple tracker functionality
document.addEventListener('DOMContentLoaded', function() {
    const tracker = document.getElementById('floatingTracker');
    const popup = document.getElementById('trackerPopup');
    const closeBtn = document.getElementById('closePopup');
    
    // Check if there's an active order
    const orderId = localStorage.getItem('activeOrderId');
    
    if (orderId) {
        console.log('Active order found:', orderId);
        tracker.style.display = 'flex';
        
        // Load order details
        loadOrderDetails(orderId);
    } else {
        console.log('No active order');
        tracker.style.display = 'none';
    }
    
    // Click tracker to show popup
    tracker.addEventListener('click', function() {
        popup.classList.toggle('active');
    });
    
    // Close popup
    closeBtn.addEventListener('click', function() {
        popup.classList.remove('active');
    });
    
    // Make tracker draggable
    makeDraggable(tracker);
});

async function loadOrderDetails(orderId) {
    try {
        const userId = localStorage.getItem('biteboxUser') ? 
            JSON.parse(localStorage.getItem('biteboxUser')).email : 'guest';
        
        const response = await fetch(`https://bbbackend-bng2.onrender.com/api/orders/active/${userId}`);
        const order = await response.json();
        
        if (order) {
            updatePopup(order);
        }
    } catch (error) {
        console.error('Error loading order:', error);
    }
}

function updatePopup(order) {
    document.getElementById('orderDetails').innerHTML = `
        <p><strong>Items:</strong> ${order.items.length}</p>
        <p><strong>Total:</strong> ₹${order.totalAmount}</p>
        <p><strong>Status:</strong> ${order.orderStatus}</p>
        <p><strong>Payment:</strong> ${order.paymentStatus}</p>
    `;
    
    // Update progress bar
    const progressMap = {
        'pending': 20,
        'confirmed': 40,
        'preparing': 60,
        'out-for-delivery': 80,
        'delivered': 100
    };
    
    document.getElementById('progressFill').style.width = 
        `${progressMap[order.orderStatus] || 0}%`;
}

function makeDraggable(element) {
    let isDragging = false;
    let currentX, currentY, initialX, initialY;
    let xOffset = 0, yOffset = 0;

    element.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);

    function dragStart(e) {
        initialX = e.clientX - xOffset;
        initialY = e.clientY - yOffset;
        isDragging = true;
    }

    function dragEnd() {
        isDragging = false;
    }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            xOffset = currentX;
            yOffset = currentY;
            element.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    }
}
</script>
<script src="maketiffinmenu.js"></script>

</body>
</html>
