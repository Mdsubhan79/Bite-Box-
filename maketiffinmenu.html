<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make Tiffin Menu</title>

<style>

/* ========= GLOBAL ========= */

body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* ========= DAY CARD ========= */

.day-card {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  overflow: hidden;
}

.day-header {
  padding: 15px;
  background: #0c2f2c;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.day-content {
  display: none;
  padding: 15px;
}

.day-content.active {
  display: block;
}

/* ========= FORM ========= */

.meal-section {
  margin-bottom: 20px;
}

.meal-section h4 {
  margin-bottom: 5px;
}

select, input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  padding: 12px 20px;
  background: #e0a500;
  color: #0c2f2c;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #ffbb00;
}

/* ========= RESPONSIVE ========= */

@media (min-width: 768px) {

  .meal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

}


    .floating-tracker {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
        border-radius: 50%;
        cursor: move;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 30px;
        box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        animation: pulse 2s infinite;
        user-select: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    .tracker-popup {
        position: fixed;
        bottom: 120px;
        right: 30px;
        width: 350px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        z-index: 10000;
        display: none;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .tracker-popup.active {
        display: block;
    }

    .popup-header {
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 20px 20px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .popup-header button {
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

    .popup-content {
        padding: 20px;
    }

    .progress-bar {
        height: 10px;
        background: #f0f0f0;
        border-radius: 5px;
        overflow: hidden;
        margin: 20px 0;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #28a745, #4CAF50);
        transition: width 0.5s ease;
    }

    .progress-steps {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #666;
        margin: 10px 0;
    }

    .step {
        text-align: center;
        flex: 1;
    }

    .step.active {
        color: #28a745;
        font-weight: bold;
    }

    .timer {
        text-align: center;
        margin: 15px 0;
        font-size: 1.2em;
        color: #ff6b6b;
        font-weight: bold;
    }

    .cancel-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        margin-top: 15px;
    }

    .cancel-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
    }

    .reorder-btn {
        background: #28a745;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        margin-top: 10px;
        display: none;
    }

    .admin-message {
        margin: 15px 0;
        padding: 12px;
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        border-radius: 5px;
        display: none;
    }

    @media (max-width: 768px) {
        .tracker-popup {
            width: 300px;
            right: 10px;
            bottom: 100px;
        }
    }




</style>
</head>

<body>

<div class="container">
<h1>Make Your Tiffin Menu As You Wish</h1>


<div id="summarySection" style="display:none;">
  <div id="summaryBox"></div>
</div>

<div id="menuSection" style="display:none;">
  <div id="menuContainer"></div>
 <div style="text-align: center; margin-top: 20px;">
  <button id="saveMenuBtn">Save Menu</button>
 </div>
</div>

<button id="remakeBtn" style="display:none;">
  Reset Menu
</button>


<!-- Floating Order Tracker - Add this before closing body tag in ALL pages -->
<div class="floating-tracker" id="floatingTracker" style="display: none;">
    <i class="fas fa-utensils"></i>
</div>

<!-- Tracker Popup -->
<div class="tracker-popup" id="trackerPopup">
    <div class="popup-header">
        <span><i class="fas fa-shopping-bag"></i> Your Order</span>
        <button id="closePopup"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-content">
        <div class="timer" id="cancellationTimer"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        
        <div class="progress-steps" id="progressSteps"></div>
        
        <div id="orderDetails" style="margin: 20px 0;"></div>
        
        <div class="admin-message" id="adminMessage" style="display: none;"></div>
        
        <button class="cancel-btn" id="cancelOrderBtn">
            <i class="fas fa-times-circle"></i> Cancel Order
        </button>
        
        <button class="reorder-btn" id="reorderBtn" style="display: none;">
            <i class="fas fa-redo-alt"></i> Reorder Now
        </button>
    </div>
</div>
<script src="maketiffinmenu.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
