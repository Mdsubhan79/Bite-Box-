<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="tracker.css">

<title>Make Tiffin Menu</title>

<style>

/* ========= GLOBAL ========= */

body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* ========= DAY CARD ========= */

.day-card {
  background: white;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  overflow: hidden;
}

.day-header {
  padding: 15px;
  background: #0c2f2c;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.day-content {
  display: none;
  padding: 15px;
}

.day-content.active {
  display: block;
}

/* ========= FORM ========= */

.meal-section {
  margin-bottom: 20px;
}

.meal-section h4 {
  margin-bottom: 5px;
}

select, input {
  width: 100%;
  padding: 8px;
  margin: 5px 0 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  padding: 12px 20px;
  background: #e0a500;
  color: #0c2f2c;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #ffbb00;
}

/* ========= RESPONSIVE ========= */

@media (min-width: 768px) {

  .meal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

}

</style>
</head>

<body>

<div class="container">
<h1>Make Your Tiffin Menu As You Wish</h1>


<div id="summarySection" style="display:none;">
  <div id="summaryBox"></div>
</div>

<div id="menuSection" style="display:none;">
  <div id="menuContainer"></div>
 <div style="text-align: center; margin-top: 20px;">
  <button id="saveMenuBtn">Save Menu</button>
 </div>
</div>

<button id="remakeBtn" style="display:none;">
  Reset Menu
</button>

<script src="maketiffinmenu.js"></script>
<!-- Floating Order Tracker -->
<div class="floating-tracker" id="floatingTracker">
    <i class="fas fa-utensils"></i>
</div>

<!-- Tracker Popup -->
<div class="tracker-popup" id="trackerPopup">
    <div class="popup-header">
        <span><i class="fas fa-shopping-bag"></i> Your Order</span>
        <button id="closePopup"><i class="fas fa-times"></i></button>
    </div>
    <div class="popup-content">
        <div class="timer" id="cancellationTimer"></div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        
        <div class="progress-steps" id="progressSteps"></div>
        
        <div id="orderDetails" style="margin: 20px 0;"></div>
        
        <div class="admin-message" id="adminMessage"></div>
        
        <button class="cancel-btn" id="cancelOrderBtn">
            <i class="fas fa-times-circle"></i> Cancel Order
        </button>
        
        <button class="reorder-btn" id="reorderBtn">
            <i class="fas fa-redo-alt"></i> Reorder Now
        </button>
    </div>
</div>


<script src="tracker-unified.js"></script>

</body>
</html>
